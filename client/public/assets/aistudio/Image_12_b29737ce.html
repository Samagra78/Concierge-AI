<div class="absolute bottom-16 left-16 z-20 max-w-lg">
<blockquote class="font-headline-lg text-headline-lg text-surface mb-6">
                    "The details make the trip."
                </blockquote>
<div class="font-label-md text-label-md text-surface/80 flex items-center gap-3">
<span class="w-8 h-[1px] bg-surface/50"></span>
                    Concierge Luxury Travel
                </div>
</div>
</div>
<!-- Right Panel: Authentication Form -->
<div class="flex flex-1 flex-col justify-center px-4 py-12 sm:px-6 lg:flex-none lg:px-20 xl:px-24 bg-background">
<div class="mx-auto w-full max-w-sm lg:w-[400px]">
<!-- Brand Header -->
<div class="mb-10 text-center">
<h2 class="font-headline-md text-headline-md text-primary tracking-tight">Concierge</h2>
<p class="font-body-md text-body-md text-slate-grey mt-2">Welcome to your premium travel experience.</p>
</div>
<!-- Auth Card -->
<div class="bg-surface border border-border-subtle rounded-xl p-card-padding">
<!-- Segmented Toggle -->
<div class="flex bg-surface-container-low p-1 rounded-lg mb-8 relative">
<!-- Active Background Indicator -->
<div class="absolute inset-y-1 left-1 w-[calc(50%-4px)] bg-surface rounded-md shadow-[0_4px_20px_rgba(0,0,0,0.05)] transition-all duration-300 ease-in-out" id="toggle-indicator"></div>
<button class="flex-1 relative z-10 py-2.5 font-label-md text-label-md text-primary text-center transition-colors" id="btn-login" onclick="switchTab('login')">
                            Log In
                        </button>
<button class="flex-1 relative z-10 py-2.5 font-label-md text-label-md text-slate-grey text-center transition-colors" id="btn-signup" onclick="switchTab('signup')">
                            Sign Up
                        </button>
</div>
<!-- Form Content -->
<div class="mt-6">
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div>
<label class="block font-label-sm text-label-sm text-slate-grey mb-2 uppercase tracking-wider" for="email">Email address</label>
<div class="relative">
<input autocomplete="email" class="block w-full border-0 border-b border-border-subtle bg-transparent py-2.5 pl-0 pr-10 text-primary font-body-md text-body-md focus:border-primary focus:ring-0 transition-colors placeholder:text-outline-variant" id="email" name="email" placeholder="traveler@example.com" required="" type="email"/>
<span class="material-symbols-outlined absolute right-2 top-2.5 text-outline-variant pointer-events-none">mail</span>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-sm text-label-sm text-slate-grey mb-2 uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<input autocomplete="current-password" class="block w-full border-0 border-b border-border-subtle bg-transparent py-2.5 pl-0 pr-10 text-primary font-body-md text-body-md focus:border-primary focus:ring-0 transition-colors placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-2 top-2.5 text-outline-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Extras Row (Forgot Password) - Only shown on Login -->
<div class="flex items-center justify-between" id="form-extras">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-border-subtle text-primary focus:ring-primary" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-sm text-label-sm text-slate-grey" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-primary hover:text-slate-grey transition-colors underline decoration-border-subtle underline-offset-4" href="#">Forgot password?</a>
</div>
</div>
<!-- Primary Action -->
<div>
<button class="flex w-full justify-center rounded-DEFAULT bg-primary px-4 py-3 font-label-md text-label-md text-surface hover:bg-inverse-surface transition-colors shadow-[0_8px_24px_rgba(0,0,0,0.12)]" type="submit">
                                    Continue
                                </button>
</div>
</form>

<span class="bg-surface px-4 font-label-sm text-label-sm text-slate-grey uppercase tracking-widest">Or</span>
</div>
</div>

<path d="M23.49 12.275C23.49 11.49 23.415 10.73 23.3 10H12V14.51H18.47C18.18 15.99 17.34 17.25 16.08 18.1L19.945 21.1C22.2 19.01 23.49 15.92 23.49 12.275Z" fill="#4285F4"></path>
<path d="M5.26498 14.2949C5.02498 13.5699 4.88501 12.7999 4.88501 11.9999C4.88501 11.1999 5.01998 10.4299 5.26498 9.7049L1.275 6.60986C0.46 8.22986 0 10.0599 0 11.9999C0 13.9399 0.46 15.7699 1.28 17.3899L5.26498 14.2949Z" fill="#FBBC05"></path>
<path d="M12.0004 24C15.2404 24 17.9654 22.935 19.9454 21.095L16.0804 18.095C15.0054 18.82 13.6204 19.245 12.0004 19.245C8.8704 19.245 6.21537 17.135 5.26537 14.29L1.27539 17.385C3.25539 21.31 7.3104 24 12.0004 24Z" fill="#34A853"></path>
</svg>
                            Continue with Google
                        </button>

<!-- Footer Links -->

<a class="font-label-sm text-label-sm text-slate-grey hover:text-primary transition-colors" href="#">Privacy</a>
<a class="font-label-sm text-label-sm text-slate-grey hover:text-primary transition-colors" href="#">Terms</a>
<a class="font-label-sm text-label-sm text-slate-grey hover:text-primary transition-colors" href="#">Support</a>
</div>
</div>
</div>
</div>
<script>
        function switchTab(tab) {
            const indicator = document.getElementById('toggle-indicator');
            const btnLogin = document.getElementById('btn-login');
            const btnSignup = document.getElementById('btn-signup');
            const extras = document.getElementById('form-extras');
            
            if (tab === 'login') {
                indicator.style.transform = 'translateX(0)';
                btnLogin.classList.add('text-primary');
                btnLogin.classList.remove('text-slate-grey');
                btnSignup.classList.remove('text-primary');
                btnSignup.classList.add('text-slate-grey');
                extras.style.display = 'flex';
            } else {
                indicator.style.transform = 'translateX(100%)';
                btnSignup.classList.add('text-primary');
                btnSignup.classList.remove('text-slate-grey');
                btnLogin.classList.remove('text-primary');
                btnLogin.classList.add('text-slate-grey');
                extras.style.display = 'none';
            }
        }
    </script>
</body></html>
